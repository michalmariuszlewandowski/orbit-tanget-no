experiments:
  # Scaled version of the small boosted-Galilean 1%-label pilot. Same n32
  # dataset and 3-seed protocol, but trained for 150 epochs instead of 60.
  - config: configs/pilot/2d_navier_stokes_galilean_small.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.epochs: 150
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_low_label_150epoch/fraction_0.01/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean_small.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.epochs: 150
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_low_label_150epoch/fraction_0.01/aug_orbit_lambda_0.05_steps_4
