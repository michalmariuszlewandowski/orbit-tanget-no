experiments:
  # Control for the semi-supervised 2D low-label result. These runs match the
  # semi-supervised trainer's four labeled updates per epoch without using
  # unlabeled orbit batches.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_update_matched_low_label_control/fraction_0.01/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_update_matched_low_label_control/fraction_0.01/aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_update_matched_low_label_control/fraction_0.02/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_update_matched_low_label_control/fraction_0.02/aug_orbit_lambda_0.05_steps_4
