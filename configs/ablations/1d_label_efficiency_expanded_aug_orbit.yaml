experiments:
  # Missing points for the 1D label-efficiency curve. Existing seed-replicated
  # rows cover 0.05, 0.25, and 1.0 for aug versus aug_orbit at lambda=0.5.
  - config: configs/baselines/1d_burgers_aug.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.01
      runtime.overwrite: false
      runtime.run_dir: runs/final_1d/label_efficiency_expanded/0.01/aug
  - config: configs/baselines/1d_burgers_aug_orbit.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.01
      training.lambda_orbit: 0.5
      runtime.overwrite: false
      runtime.run_dir: runs/final_1d/label_efficiency_expanded/0.01/aug_orbit

