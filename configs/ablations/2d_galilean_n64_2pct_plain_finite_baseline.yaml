experiments:
  # Raw finite equivariance MSE with the same Galilean transforms as normalized
  # LOCO. For delta_i ~ U[-r,r] and r=0.25, E||delta||^2 = 2r^2/3 = 1/24,
  # so lambda=2.4 matches the leading expected scale of normalized LOCO at
  # lambda=0.1.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 2.4
      training.normalize_by_epsilon: false
      symmetry.max_boost: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_plain_finite_baseline/fraction_0.02/aug_plain_finite_lambda_2.4_steps_4
