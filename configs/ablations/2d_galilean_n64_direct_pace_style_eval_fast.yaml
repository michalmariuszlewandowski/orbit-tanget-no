common: &common
  split: test
  orbit_samples: 1
  batch_size: 16
  latency_repeats: 3
  latency_warmup: 1

symmetry_010: &symmetry_010
  name: navier_stokes2d_galilean
  max_boost: 0.10
  final_time: 0.5
  length: 1.0
  boost_x_channel: 1
  boost_y_channel: 2

symmetry_020: &symmetry_020
  <<: *symmetry_010
  max_boost: 0.20

symmetry_025: &symmetry_025
  <<: *symmetry_010
  max_boost: 0.25

symmetry_035: &symmetry_035
  <<: *symmetry_010
  max_boost: 0.35

symmetry_050: &symmetry_050
  <<: *symmetry_010
  max_boost: 0.50

evaluations:
  - <<: *common
    severity: boost_0.10
    severity_scale: 0.40
    method: aug_steps_6
    seeds: [23, 31, 47, 59, 71]
    checkpoint: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.02/aug_steps_6/seed_{seed}/checkpoints/best.pt
    out_dir: runs/ablations/2d_galilean_n64_direct_pace_style_eval_fast/fraction_0.02/boost_0.10/aug_steps_6/seed_{seed}
    symmetry: *symmetry_010
  - <<: *common
    severity: boost_0.10
    severity_scale: 0.40
    method: aug_orbit_lambda_0.1_steps_4
    seeds: [23, 31, 47, 59, 71]
    checkpoint: runs/ablations/2d_galilean_n64_2pct_lambda_robustness/fraction_0.02/aug_orbit_lambda_0.1_steps_4/seed_{seed}/checkpoints/best.pt
    out_dir: runs/ablations/2d_galilean_n64_direct_pace_style_eval_fast/fraction_0.02/boost_0.10/aug_orbit_lambda_0.1_steps_4/seed_{seed}
    symmetry: *symmetry_010
  - <<: *common
    severity: boost_0.20
    severity_scale: 0.80
    method: aug_steps_6
    seeds: [23, 31, 47, 59, 71]
    checkpoint: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.02/aug_steps_6/seed_{seed}/checkpoints/best.pt
    out_dir: runs/ablations/2d_galilean_n64_direct_pace_style_eval_fast/fraction_0.02/boost_0.20/aug_steps_6/seed_{seed}
    symmetry: *symmetry_020
  - <<: *common
    severity: boost_0.20
    severity_scale: 0.80
    method: aug_orbit_lambda_0.1_steps_4
    seeds: [23, 31, 47, 59, 71]
    checkpoint: runs/ablations/2d_galilean_n64_2pct_lambda_robustness/fraction_0.02/aug_orbit_lambda_0.1_steps_4/seed_{seed}/checkpoints/best.pt
    out_dir: runs/ablations/2d_galilean_n64_direct_pace_style_eval_fast/fraction_0.02/boost_0.20/aug_orbit_lambda_0.1_steps_4/seed_{seed}
    symmetry: *symmetry_020
  - <<: *common
    severity: train_radius
    severity_scale: 1.00
    method: aug_steps_6
    seeds: [23, 31, 47, 59, 71]
