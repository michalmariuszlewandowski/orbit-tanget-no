experiments:
  # Cheap high-lambda probe for the 2%-label N64 Galilean Aug+Orbit setting.
  # The existing sweep stops at lambda_orbit=0.10, which is the best completed
  # value. Lambda 0.20 and 0.30 are expanded to matched seeds to compare
  # high-weight settings against the completed lambda 0.10 row.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.20
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_lambda_high_probe/fraction_0.02/aug_orbit_lambda_0.2_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.30
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_lambda_high_probe/fraction_0.02/aug_orbit_lambda_0.3_steps_4
