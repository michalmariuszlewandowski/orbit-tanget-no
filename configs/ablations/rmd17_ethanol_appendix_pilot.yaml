experiments:
  # One-seed appendix pilot. Expand to 3 seeds and 500/1000 labels only if the
  # defect signal is present and the controls behave as controls.
  - config: configs/pilot/rmd17_ethanol_force.yaml
    seeds: [23]
    overrides:
      training.method: baseline
      runtime.run_dir: runs/appendix/rmd17_ethanol/labels_100/baseline
      runtime.overwrite: false

  - config: configs/pilot/rmd17_ethanol_force.yaml
    seeds: [23]
    overrides:
      training.method: aug
      runtime.run_dir: runs/appendix/rmd17_ethanol/labels_100/aug
      runtime.overwrite: false

  - config: configs/pilot/rmd17_ethanol_force.yaml
    seeds: [23]
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.01
      runtime.run_dir: runs/appendix/rmd17_ethanol/labels_100/aug_orbit_lambda_0.01
      runtime.overwrite: false

  - config: configs/pilot/rmd17_ethanol_force.yaml
    seeds: [23]
    overrides:
      training.method: aug_orbit_no_output
      training.lambda_orbit: 0.01
      runtime.run_dir: runs/appendix/rmd17_ethanol/labels_100/aug_orbit_no_output_lambda_0.01
      runtime.overwrite: false

  - config: configs/pilot/rmd17_ethanol_force.yaml
    seeds: [23]
    overrides:
      training.method: aug_orbit_shuffle
      training.lambda_orbit: 0.01
      runtime.run_dir: runs/appendix/rmd17_ethanol/labels_100/aug_orbit_shuffle_lambda_0.01
      runtime.overwrite: false
