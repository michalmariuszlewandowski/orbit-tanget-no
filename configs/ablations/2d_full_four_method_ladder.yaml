experiments:
  # Full 150-epoch 2D ladder at seed 31. The augmentation runs reuse the
  # completed full-resolution lambda follow-up; baseline and orbit are the
  # missing entries needed for the paper-facing four-method table.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: baseline
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_four_method_ladder/baseline
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_four_method_ladder/orbit

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: aug
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug_orbit/lambda_0.05
