experiments:
  - config: configs/pilot/1d_burgers_translation_galilean.yaml
    overrides:
      model.add_grid: true
      training.method: orbit
      runtime.run_dir: runs/ablations/grid/add_grid_true_orbit
  - config: configs/pilot/1d_burgers_translation_galilean.yaml
    overrides:
      model.add_grid: false
      training.method: orbit
      runtime.run_dir: runs/ablations/grid/add_grid_false_orbit
  - config: configs/baselines/1d_burgers_baseline.yaml
    overrides:
      model.add_grid: true
      runtime.run_dir: runs/ablations/grid/add_grid_true_baseline
  - config: configs/baselines/1d_burgers_baseline.yaml
    overrides:
      model.add_grid: false
      runtime.run_dir: runs/ablations/grid/add_grid_false_baseline
