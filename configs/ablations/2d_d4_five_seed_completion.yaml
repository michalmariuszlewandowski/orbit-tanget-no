experiments:
  # Complete the D4 architectural comparison to five seeds. Seeds 23, 31, and
  # 47 already exist from the pilot/refinement/replication matrices.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [59, 71]
    overrides:
      symmetry.transforms:
        - name: d4_vorticity2d
      symmetry.probabilities: [1.0]
      training.method: aug
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_d4_five_seed_completion/fraction_0.01/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [59, 71]
    overrides:
      symmetry.transforms:
        - name: d4_vorticity2d
      symmetry.probabilities: [1.0]
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.2
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_d4_five_seed_completion/fraction_0.01/aug_orbit_lambda_0.2_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [59, 71]
    overrides:
      model.name: d4_gfno2d
      model.width: 8
      model.modes1: 6
      model.modes2: 6
      model.depth: 4
      model.add_grid: false
      model.input_pseudoscalar: true
      model.output_pseudoscalar: true
      symmetry.transforms:
        - name: d4_vorticity2d
      symmetry.probabilities: [1.0]
      training.method: baseline
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_d4_five_seed_completion/fraction_0.01/d4_gfno2d_steps_4
