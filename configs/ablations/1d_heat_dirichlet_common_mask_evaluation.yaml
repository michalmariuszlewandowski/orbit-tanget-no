evaluations:
  # Re-evaluate every boundary-diagnostic checkpoint on identical transformed
  # examples and a common scoring region.  This removes the training/evaluation
  # mask confound in the original cached summary.
  - severity: full_domain
    severity_scale: 0
    methods: [baseline, aug_orbit_no_mask, aug_orbit_mask]
    seeds: [23, 31, 47]
    checkpoint: runs/ablations/1d_heat_dirichlet_boundary_mask/{method}/seed_{seed}/checkpoints/best.pt
    out_dir: runs/evaluations/1d_heat_dirichlet_common_mask/full_domain/{method}/seed_{seed}
    split: test
    orbit_samples: 4
    batch_size: 32
    symmetry:
      name: nonperiodic_translation1d
      max_shift: 0.10
      length: 1.0
      use_mask: false
      mask_margin: 0.05

  - severity: valid_overlap_margin_0.05
    severity_scale: 1
    methods: [baseline, aug_orbit_no_mask, aug_orbit_mask]
    seeds: [23, 31, 47]
    checkpoint: runs/ablations/1d_heat_dirichlet_boundary_mask/{method}/seed_{seed}/checkpoints/best.pt
    out_dir: runs/evaluations/1d_heat_dirichlet_common_mask/valid_overlap_margin_0.05/{method}/seed_{seed}
    split: test
    orbit_samples: 4
    batch_size: 32
    symmetry:
      name: nonperiodic_translation1d
      max_shift: 0.10
      length: 1.0
      use_mask: true
      mask_margin: 0.05
