experiments:
  # Full-resolution 2D seed replication for the paper-facing comparison.
  # Seed 31 reuses the completed lambda-refinement follow-up run; seeds 23
  # and 47 are launched under a fresh replication root.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 23
      training.method: aug
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_seed_replication/seed_23/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 23
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_seed_replication/seed_23/aug_orbit_lambda_0.05

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: aug
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 31
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug_orbit/lambda_0.05

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 47
      training.method: aug
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_seed_replication/seed_47/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      seed: 47
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_seed_replication/seed_47/aug_orbit_lambda_0.05
