x-common-overrides: &common_overrides
  dataset.path: data/2d_ns_vorticity_galilean_n64.pt
  dataset.split: test
  adaptation.trainable: projector
  adaptation.epochs: 5
  adaptation.batch_size: 16
  adaptation.lr: 0.00001
  adaptation.weight_decay: 0.0
  adaptation.beta_l2_initial: 0.0
  adaptation.gamma_prediction_preservation: 1.0
  adaptation.normalize_by_epsilon: true
  adaptation.orbit_eta: 0.000001
  adaptation.eval_orbit_samples: 4
  adaptation.grad_clip: 0.1
  adaptation.latency_repeats: 5
  adaptation.latency_warmup: 2
  adaptation.adapt_on_target_inputs: true
  runtime.overwrite: false

x-boost-035: &boost_035
  name: navier_stokes2d_galilean
  max_boost: 0.35
  final_time: 0.5
  length: 1.0
  boost_x_channel: 1
  boost_y_channel: 2

x-boost-050: &boost_050
  name: navier_stokes2d_galilean
  max_boost: 0.50
  final_time: 0.5
  length: 1.0
  boost_x_channel: 1
  boost_y_channel: 2

adaptations:
  - config: configs/pilot/2d_navier_stokes_unlabeled_adapt.yaml
    seeds: [23, 31, 47]
    overrides:
      <<: *common_overrides
      adaptation.source_method: baseline_steps_4
      adaptation.loss_mode: orbit_preserve
      adaptation.target_severity: boost_0.35
      adaptation.checkpoint: runs/ablations/2d_galilean_n64_2pct_headline_5seed/fraction_0.02/baseline_steps_4/seed_{seed}/checkpoints/best.pt
      adaptation.eval_symmetry: *boost_035
      adaptation.target_input_symmetry: *boost_035
      adaptation.orbit_symmetry: *boost_035
      runtime.run_dir: runs/adaptation/2d_galilean_n64_2pct_target_boost/boost_0.35/baseline_steps_4/orbit_preserve_projector_e5/seed_{seed}

