adaptations:
  - config: configs/pilot/1d_burgers_unlabeled_adapt.yaml
    seeds: [23, 31, 47]
    allow_missing_checkpoint: true
    format:
      source_method: baseline
      beta_label: "0.01"
      epochs: 1
    overrides:
      adaptation.checkpoint: runs/final_1d/four_method/{source_method}/seed_{seed}/checkpoints/best.pt
      adaptation.source_method: "{source_method}"
      adaptation.trainable: projector
      adaptation.epochs: 1
      adaptation.batch_size: 32
      adaptation.lr: 0.00001
      adaptation.beta_l2_initial: 0.01
      adaptation.orbit_eta: 0.000001
      adaptation.eval_orbit_samples: 8
      adaptation.grad_clip: 0.1
      adaptation.latency_repeats: 10
      adaptation.latency_warmup: 3
      runtime.overwrite: false
      runtime.run_dir: runs/final_1d/unlabeled_adaptation/{source_method}/beta_{beta_label}/epochs_{epochs}/seed_{seed}

