experiments:
  # Complete a 3-seed small boosted-Galilean 1%-label comparison. Seed 23 is
  # available from 2d_galilean_low_label_pilot.
  - config: configs/pilot/2d_navier_stokes_galilean_small.yaml
    seeds: [31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_low_label_seed_replication/fraction_0.01/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean_small.yaml
    seeds: [31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_low_label_seed_replication/fraction_0.01/aug_orbit_lambda_0.05_steps_4
