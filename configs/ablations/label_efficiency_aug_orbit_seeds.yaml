experiments:
  # Focused seed replication for the label-efficiency table.
  # Three fractions, supervised augmentation versus augmentation + orbit.
  - config: configs/baselines/1d_burgers_aug.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/0.05/aug
  - config: configs/baselines/1d_burgers_aug_orbit.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.05
      training.lambda_orbit: 0.5
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/0.05/aug_orbit

  - config: configs/baselines/1d_burgers_aug.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/0.25/aug
  - config: configs/baselines/1d_burgers_aug_orbit.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 0.25
      training.lambda_orbit: 0.5
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/0.25/aug_orbit

  - config: configs/baselines/1d_burgers_aug.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 1.0
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/1.0/aug
  - config: configs/baselines/1d_burgers_aug_orbit.yaml
    seeds: [23, 31, 47]
    overrides:
      training.data_fraction: 1.0
      training.lambda_orbit: 0.5
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/label_efficiency_seed_replication/1.0/aug_orbit
