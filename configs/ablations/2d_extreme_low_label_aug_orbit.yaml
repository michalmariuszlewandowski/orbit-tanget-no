experiments:
  # Extreme low-label 2D comparison. This targets the regime where the 1D
  # label-efficiency result is strongest.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.01
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.01/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      training.data_fraction: 0.01
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.01/aug_orbit_lambda_0.05

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.02
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.02/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      training.data_fraction: 0.02
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.02/aug_orbit_lambda_0.05

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.05/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      training.data_fraction: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_extreme_low_label_aug_orbit/fraction_0.05/aug_orbit_lambda_0.05
