experiments:
  # Semi-supervised 2D low-label experiment. Supervised and augmentation losses
  # use the labeled fraction; orbit consistency samples unlabeled batches from
  # the full training split.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: semi_aug_orbit
      training.data_fraction: 0.01
      training.orbit_data_fraction: 1.0
      training.orbit_steps_per_epoch: 4
      training.orbit_batch_size: 16
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_semi_supervised_low_label_aug_orbit/fraction_0.01/semi_aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: semi_aug_orbit
      training.data_fraction: 0.02
      training.orbit_data_fraction: 1.0
      training.orbit_steps_per_epoch: 4
      training.orbit_batch_size: 16
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_semi_supervised_low_label_aug_orbit/fraction_0.02/semi_aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: semi_aug_orbit
      training.data_fraction: 0.05
      training.orbit_data_fraction: 1.0
      training.orbit_steps_per_epoch: 4
      training.orbit_batch_size: 16
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_semi_supervised_low_label_aug_orbit/fraction_0.05/semi_aug_orbit_lambda_0.05_steps_4
