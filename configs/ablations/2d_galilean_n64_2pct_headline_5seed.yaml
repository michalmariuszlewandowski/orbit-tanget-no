experiments:
  # Overnight headline table for the N64 boosted-Galilean 2%-label setting.
  # This completes the paper-facing four-method comparison and extends the
  # decisive augmentation-vs-orbit comparison from 3 to 5 seeds.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: baseline
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_headline_5seed/fraction_0.02/baseline_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_headline_5seed/fraction_0.02/orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug
      training.data_fraction: 0.02
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.02/aug_steps_6

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_paper_ladder/fraction_0.02/aug_orbit_lambda_0.05_steps_4
