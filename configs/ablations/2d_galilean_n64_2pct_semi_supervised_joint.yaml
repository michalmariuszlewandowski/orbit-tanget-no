experiments:
  # Semi-supervised N64 Galilean orbit training at 2% labels. Supervised and
  # augmentation losses use the labeled subset; orbit consistency samples
  # inputs from the full training split through orbit_data_fraction=1.0.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: semi_aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.orbit_data_fraction: 1.0
      training.orbit_steps_per_epoch: 4
      training.orbit_batch_size: 16
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_semi_supervised_joint/fraction_0.02/semi_aug_orbit_lambda_0.05_steps_4
