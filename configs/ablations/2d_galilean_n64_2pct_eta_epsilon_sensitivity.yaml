experiments:
  # Finite-difference denominator and local-step sensitivity at 2% labels.
  # Eta settings hold the step radius fixed; epsilon settings hold eta fixed.
  # The shared default setting is included once.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.00000001
      symmetry.max_boost: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-8/eps_0.25

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
