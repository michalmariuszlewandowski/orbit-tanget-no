experiments:
  # Compact robustness sweep for the finite-difference denominator and local
  # step distribution in the N64 2%-label Galilean Aug+Orbit setting.
  #
  # Eta settings keep the default step radius fixed. Epsilon settings keep the
  # default eta fixed. The shared default row is included once.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.00000001
      symmetry.max_boost: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-8/eps_0.25

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.000001
      symmetry.max_boost: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-6/eps_0.25

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.0001
      symmetry.max_boost: 0.25
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-4/eps_0.25

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.000001
      symmetry.max_boost: 0.125
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-6/eps_0.125

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.1
      training.orbit_eta: 0.000001
      symmetry.max_boost: 0.5
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_eta_epsilon_sensitivity/eta_1e-6/eps_0.5
