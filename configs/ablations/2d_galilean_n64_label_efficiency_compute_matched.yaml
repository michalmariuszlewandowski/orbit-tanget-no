experiments:
  # N64 Galilean label-efficiency comparison with six augmentation updates or
  # four augmentation-plus-orbit updates per epoch. Each setting uses
  # 12 batch-level model evaluations per epoch.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.005
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.005/aug_steps_6

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.005
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.005/aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.01
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.01/aug_steps_6

  # At 1%, aug_orbit_steps_4 spans the seed-23 pilot and seeds-31/47 replication.
  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_low_label_pilot/fraction_0.01/aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_low_label_seed_replication/fraction_0.01/aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.02
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_label_efficiency_compute_matched/fraction_0.02/aug_steps_6

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.02
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_paper_ladder/fraction_0.02/aug_orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug
      training.data_fraction: 0.05
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_compute_matched/fraction_0.05/aug_steps_6

  - config: configs/pilot/2d_navier_stokes_galilean.yaml
    seeds: [23, 31, 47]
    overrides:
      training.method: aug_orbit
      training.data_fraction: 0.05
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_paper_ladder/fraction_0.05/aug_orbit_lambda_0.05_steps_4
