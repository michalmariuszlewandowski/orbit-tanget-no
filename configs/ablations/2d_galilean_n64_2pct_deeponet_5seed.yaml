experiments:
  # Full four-method DeepONet reproduction of the FNO headline protocol.
  # The pre-registered primary contrast is augmentation versus augmentation
  # plus normalized LOCO; those rows each use 12 batch-level model evaluations
  # per epoch (6 x 2 versus 4 x 3). Baseline and orbit-only are decomposition
  # rows using the same update schedules as the corresponding FNO rows.
  - config: configs/pilot/2d_navier_stokes_galilean_deeponet.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: baseline
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_deeponet_5seed/fraction_0.02/baseline_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean_deeponet.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: orbit
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_deeponet_5seed/fraction_0.02/orbit_lambda_0.05_steps_4

  - config: configs/pilot/2d_navier_stokes_galilean_deeponet.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug
      training.steps_per_epoch: 6
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_deeponet_5seed/fraction_0.02/aug_steps_6

  - config: configs/pilot/2d_navier_stokes_galilean_deeponet.yaml
    seeds: [23, 31, 47, 59, 71]
    overrides:
      training.method: aug_orbit
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.10
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_galilean_n64_2pct_deeponet_5seed/fraction_0.02/aug_loco_lambda_0.1_steps_4
