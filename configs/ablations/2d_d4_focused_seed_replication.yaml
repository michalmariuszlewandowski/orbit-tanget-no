experiments:
  # D4 comparison at seeds 31 and 47 with 1% labels. Seed 23 is defined in the
  # pilot and refinement matrices.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [31, 47]
    overrides:
      symmetry.transforms:
        - name: d4_vorticity2d
      symmetry.probabilities: [1.0]
      training.method: aug
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_d4_focused_seed_replication/fraction_0.01/aug_steps_4

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    seeds: [31, 47]
    overrides:
      symmetry.transforms:
        - name: d4_vorticity2d
      symmetry.probabilities: [1.0]
      training.method: aug_orbit
      training.data_fraction: 0.01
      training.steps_per_epoch: 4
      training.lambda_orbit: 0.2
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_d4_focused_seed_replication/fraction_0.01/aug_orbit_lambda_0.2_steps_4
