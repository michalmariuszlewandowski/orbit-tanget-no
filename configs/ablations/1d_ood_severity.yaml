evaluations:
  - severity: train_radius
    severity_scale: 1.0
    methods: [baseline, aug, orbit, aug_orbit]
    seeds: [23, 31, 47]
    allow_missing_checkpoint: true
    checkpoint: runs/final_1d/four_method/{method}/seed_{seed}/checkpoints/best.pt
    out_dir: runs/final_1d/ood_severity/scale_1.0/{method}/seed_{seed}
    split: test
    orbit_samples: 8
    batch_size: 32
    symmetry:
      transforms:
        - name: translation1d
          max_shift: 0.25
          length: 1.0
        - name: burgers1d_galilean
          max_boost: 0.35
          final_time: 0.5
          length: 1.0
          channel: 0
      probabilities: [0.5, 0.5]

