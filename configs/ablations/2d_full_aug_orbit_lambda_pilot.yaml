experiments:
  # Full-resolution follow-up from the small 2D diagnostic.
  # Run with chunked resume on CPU when needed:
  #   training.stop_after_epochs: 20 for each invocation, runtime.resume=true after the first.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: aug
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug

  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.01
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug_orbit/lambda_0.01
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: aug_orbit
      training.lambda_orbit: 0.05
      runtime.overwrite: false
      runtime.run_dir: runs/ablations/2d_full_aug_orbit_lambda/aug_orbit/lambda_0.05
