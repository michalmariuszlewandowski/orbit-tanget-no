experiments:
  # June 10 gate: method must reduce equivariance defect on cheap exact-symmetry data.
  - config: configs/pilot/1d_advection_translation.yaml
    overrides:
      training.method: baseline
      runtime.run_dir: runs/june10/1d_advection/baseline
  - config: configs/pilot/1d_advection_translation.yaml
    overrides:
      training.method: orbit
      runtime.run_dir: runs/june10/1d_advection/orbit

  # June 24 gate: Burgers translation + Galilean pilot.
  - config: configs/baselines/1d_burgers_baseline.yaml
  - config: configs/baselines/1d_burgers_aug.yaml
  - config: configs/pilot/1d_burgers_translation_galilean.yaml
  - config: configs/baselines/1d_burgers_aug_orbit.yaml
  - config: configs/baselines/1d_burgers_canonical.yaml

  # July 15 gate: 2D periodic vorticity experiment.
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: baseline
      runtime.run_dir: runs/july15/2d_ns/baseline
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: aug
      runtime.run_dir: runs/july15/2d_ns/aug
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: orbit
      runtime.run_dir: runs/july15/2d_ns/orbit
  - config: configs/pilot/2d_navier_stokes_translation_d4.yaml
    overrides:
      training.method: aug_orbit
      runtime.run_dir: runs/july15/2d_ns/aug_orbit
