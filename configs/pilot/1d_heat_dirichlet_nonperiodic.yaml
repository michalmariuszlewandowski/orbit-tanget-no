seed: 23

dataset:
  kind: heat1d_dirichlet
  path: data/1d_heat_dirichlet_n64.pt
  generate_if_missing: true
  n: 64
  num_train: 512
  num_val: 128
  num_test: 128
  final_time: 0.1
  diffusivity: 0.01
  modes: 8
  amplitude: 1.0
  seed: 23

model:
  name: fno1d
  in_channels: 1
  out_channels: 1
  width: 32
  modes: 12
  depth: 4
  add_grid: true

symmetry:
  name: nonperiodic_translation1d
  max_shift: 0.1
  length: 1.0
  use_mask: true
  mask_margin: 0.05

training:
  method: aug_orbit
  epochs: 80
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  lambda_orbit: 0.05
  lambda_aug: 1.0
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_every: 10
  eval_orbit_samples: 4
  data_fraction: 0.1
  num_workers: 0
  grad_clip: 1.0
  latency_repeats: 20
  latency_warmup: 5

runtime:
  deterministic: false
  device: auto
  run_dir: runs/pilot/1d_heat_dirichlet_nonperiodic/aug_orbit_mask
