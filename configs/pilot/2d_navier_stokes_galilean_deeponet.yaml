seed: 31

dataset:
  kind: navier_stokes_vorticity2d_boosted
  path: data/2d_ns_vorticity_galilean_n64.pt
  generate_if_missing: true
  n: 64
  num_train: 1024
  num_val: 128
  num_test: 256
  final_time: 0.5
  dt: 0.001
  viscosity: 0.001
  smoothness: 8.0
  amplitude: 1.0
  max_boost: 0.5
  solver_batch_size: 8
  dealias: true
  seed: 31

model:
  name: deeponet2d
  in_channels: 3
  out_channels: 1
  grid_height: 64
  grid_width: 64
  branch_channels: [32, 64, 128, 256]
  branch_fc_hidden: 480
  trunk_hidden: 256
  trunk_depth: 3
  latent_dim: 256
  coordinate_modes: 12

symmetry:
  name: navier_stokes2d_galilean
  max_boost: 0.25
  final_time: 0.5
  length: 1.0
  boost_x_channel: 1
  boost_y_channel: 2

training:
  method: aug_orbit
  epochs: 150
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  lambda_orbit: 0.10
  lambda_aug: 1.0
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_every: 10
  eval_orbit_samples: 4
  data_fraction: 0.02
  steps_per_epoch: 4
  num_workers: 0
  grad_clip: 1.0
  latency_repeats: 20
  latency_warmup: 5

runtime:
  deterministic: false
  device: auto
  overwrite: false
  run_dir: runs/pilot/2d_ns_galilean_deeponet/aug_orbit
