seed: 11

dataset:
  kind: advection1d
  path: data/1d_advection_n128.pt
  generate_if_missing: true
  n: 128
  num_train: 1024
  num_val: 128
  num_test: 256
  final_time: 0.5
  velocity: 0.8
  modes: 8
  amplitude: 1.0
  seed: 11

model:
  name: fno1d
  in_channels: 1
  out_channels: 1
  width: 64
  modes: 16
  depth: 4
  add_grid: false

symmetry:
  name: translation1d
  max_shift: 0.25
  length: 1.0

training:
  method: orbit
  epochs: 100
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  lambda_orbit: 0.1
  lambda_aug: 1.0
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_every: 10
  eval_orbit_samples: 4
  data_fraction: 1.0
  num_workers: 0
  grad_clip: 1.0

  latency_repeats: 20
  latency_warmup: 5

runtime:
  deterministic: false
  device: auto
  run_dir: runs/pilot/1d_advection_translation/orbit
