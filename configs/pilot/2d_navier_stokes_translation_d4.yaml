seed: 31

dataset:
  kind: navier_stokes_vorticity2d
  path: data/2d_ns_vorticity_n64.pt
  generate_if_missing: true
  n: 64
  num_train: 1024
  num_val: 128
  num_test: 256
  final_time: 0.5
  dt: 0.001
  viscosity: 0.001
  smoothness: 8.0
  amplitude: 1.0
  solver_batch_size: 8
  dealias: true
  seed: 31

model:
  name: fno2d
  in_channels: 1
  out_channels: 1
  width: 48
  modes1: 12
  modes2: 12
  depth: 4
  add_grid: false

symmetry:
  transforms:
    - name: translation2d
      max_shift: 0.25
      length: 1.0
    - name: d4_vorticity2d
  probabilities: [0.75, 0.25]

training:
  method: orbit
  epochs: 150
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  lambda_orbit: 0.05
  lambda_aug: 1.0
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_every: 10
  eval_orbit_samples: 4
  data_fraction: 1.0
  num_workers: 0
  grad_clip: 1.0

  latency_repeats: 20
  latency_warmup: 5

runtime:
  deterministic: false
  device: auto
  run_dir: runs/pilot/2d_ns_translation_d4/orbit
