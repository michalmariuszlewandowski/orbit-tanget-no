seed: 23

dataset:
  path: data/1d_burgers_n128.pt
  split: test

adaptation:
  checkpoint: runs/baselines/1d_burgers/baseline/checkpoints/best.pt
  trainable: projector       # one of: projector, last_block, all
  epochs: 20
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0
  beta_l2_initial: 0.0001
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_orbit_samples: 4
  grad_clip: 1.0

runtime:
  deterministic: false
  device: auto
  run_dir: runs/adaptation/1d_burgers/projector
