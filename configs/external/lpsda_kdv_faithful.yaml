seed: 23

dataset:
  kind: lpsda_kdv1d
  path: data/lpsda_kdv_faithful_64.pt
  generate_if_missing: true
  train_samples: 64
  valid_samples: 512
  test_samples: 512
  nx: 256
  nt: 250
  nt_effective: 140
  end_time: 100.0
  dt: 0.4
  length: 128.0
  tol: 1.0e-9

model:
  name: fno1d
  in_channels: 20
  out_channels: 20
  modes: 32
  width: 256
  depth: 5
  num_layers: 5
  time_history: 20
  time_future: 20

symmetry:
  name: kdv1d_galilean
  max_boost: 0.2
  final_time: 100.0
  input_steps: 20
  output_steps: 20
  length: 128.0

training:
  method: baseline
  batch_size: 16
  epochs: 20
  lr: 1.0e-4
  lr_decay: 0.4
  unrolling: 0
  print_interval: 20
  cycles_multiplier: 2
  max_cycles_per_epoch:
  augmentation:
    time_shift: 0
    max_x_shift: 0.0
    max_velocity: 0.0
    max_scale: 0.0

runtime:
  device: auto
  run_dir: runs/external/lpsda_kdv_faithful/baseline/seed_23
