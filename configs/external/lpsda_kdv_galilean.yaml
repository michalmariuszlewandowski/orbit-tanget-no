# LPSDA-style KdV external benchmark pilot.
# Published reference: Brandstetter et al., ICML 2022, Table 3, KdV FNO(NO).
seed: 23

dataset:
  kind: kdv1d
  path: data/lpsda_kdv_n256_64.pt
  generate_if_missing: true
  n: 256
  num_train: 64
  num_val: 32
  num_test: 64
  length: 128.0
  final_time: 20.0
  dt: 0.05
  input_steps: 20
  output_steps: 100
  terms: 10
  solver_batch_size: 8
  dealias: true
  seed: 23

model:
  name: fno1d
  in_channels: 20
  out_channels: 100
  width: 64
  modes: 32
  depth: 4
  add_grid: false

symmetry:
  name: kdv1d_galilean
  max_boost: 0.2
  final_time: 20.0
  input_steps: 20
  output_steps: 100
  length: 128.0

training:
  method: baseline
  loss: trajectory_nmse
  epochs: 20
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.00000001
  lambda_orbit: 0.05
  lambda_aug: 1.0
  normalize_by_epsilon: true
  orbit_eta: 0.000001
  eval_every: 5
  eval_orbit_samples: 4
  num_workers: 0
  grad_clip: 1.0
  latency_repeats: 10
  latency_warmup: 3

runtime:
  deterministic: false
  device: auto
  run_dir: runs/external/lpsda_kdv_galilean/baseline/seed_23
