# Lightweight analytic canonicalization baseline for translation + Burgers Galilean shifts.
seed: 23
dataset:
  kind: burgers1d
  path: data/1d_burgers_n128.pt
  generate_if_missing: true
  n: 128
  num_train: 2048
  num_val: 256
  num_test: 512
  final_time: 0.5
  dt: 0.001
  viscosity: 0.01
  modes: 8
  amplitude: 0.8
  mean: 0.0
  solver_batch_size: 64
  dealias: true
  seed: 23
model:
  name: canonical_fno1d
  in_channels: 1
  out_channels: 1
  width: 64
  modes: 16
  depth: 4
  add_grid: true
  canonicalizers: [galilean_mean, translation_first_mode]
  canonical_channel: 0
  translation_mode: 1
  final_time: 0.5
  length: 1.0
symmetry:
  transforms:
    - name: translation1d
      max_shift: 0.25
      length: 1.0
    - name: burgers1d_galilean
      max_boost: 0.35
      final_time: 0.5
      length: 1.0
      channel: 0
  probabilities: [0.5, 0.5]
training:
  method: baseline
  epochs: 150
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  eval_every: 10
  eval_orbit_samples: 4
  grad_clip: 1.0
  latency_repeats: 20
  latency_warmup: 5
runtime:
  deterministic: false
  device: auto
  run_dir: runs/baselines/1d_burgers/canonical
